<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exercise Timer</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(to bottom right,#e2e8f0,#cbd5e1);display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:white;width:420px;max-width:90%;border-radius:30px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}h1{margin-top:0;color:#1e293b}.subtitle{color:#64748b;margin-bottom:25px}.exercise{font-size:28px;font-weight:bold;color:#1e293b;margin:20px 0;min-height:70px}.mode{display:inline-block;padding:10px 20px;border-radius:20px;font-weight:bold;margin-bottom:15px;color:white}.exercise-mode{background:#22c55e}.rest-mode{background:#3b82f6}.timer{font-size:100px;font-weight:bold;color:#1e293b;margin:25px 0}.buttons{display:flex;gap:15px;justify-content:center;margin-top:20px}button{border:0;border-radius:20px;padding:18px 25px;font-size:22px;font-weight:bold;cursor:pointer;color:white}.start{background:#22c55e}.pause{background:#f59e0b}.reset{background:#64748b}.progress{width:100%;height:20px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:30px}.progress-bar{height:100%;width:0%;background:#22c55e;transition:width .5s}.complete{font-size:36px;color:#22c55e;font-weight:bold;margin-top:30px}
</style></head>
<body><div class="container"><h1>Exercise Timer</h1><div class="subtitle">10 exercises • 30 sec work • 30 sec rest</div><div id="mode" class="mode exercise-mode">EXERCISE</div><div id="exercise" class="exercise"></div><div id="timer" class="timer">30</div><div id="status"></div><div class="buttons"><button id="startBtn" class="start">▶ START</button><button id="pauseBtn" class="pause">⏸ PAUSE</button><button id="resetBtn" class="reset">🔄 RESET</button></div><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div id="complete" class="complete" style="display:none;">🎉 Workout Complete!</div></div>
<script>
const exercises=["Warm up Stretches","Balance on left leg","Balance on right leg","Sit to stand","Arm circles forward","Arm circles backward","Row right hand","Row left hand","Leg lifts upper thigh","Cool down stretches"];
const EXERCISE_DURATION=30,REST_DURATION=30;let currentExercise=0,timeLeft=EXERCISE_DURATION,isRunning=false,isResting=false,timerInterval;
const timerEl=document.getElementById('timer'),exerciseEl=document.getElementById('exercise'),modeEl=document.getElementById('mode'),progressBar=document.getElementById('progressBar'),completeEl=document.getElementById('complete');
function updateDisplay(){timerEl.textContent=timeLeft;if(isResting){modeEl.textContent='REST';modeEl.className='mode rest-mode';exerciseEl.textContent='Rest before '+exercises[currentExercise+1]}else{modeEl.textContent='EXERCISE';modeEl.className='mode exercise-mode';exerciseEl.textContent=exercises[currentExercise]}progressBar.style.width=(currentExercise/exercises.length*100)+'%'}
function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);speechSynthesis.speak(utterance)}}
function beep(){const ctx=new(window.AudioContext||window.webkitAudioContext)(),oscillator=ctx.createOscillator();oscillator.type='sine';oscillator.frequency.setValueAtTime(800,ctx.currentTime);oscillator.connect(ctx.destination);oscillator.start();oscillator.stop(ctx.currentTime+.15)}
function startTimer(){if(isRunning)return;isRunning=true;timerInterval=setInterval(()=>{timeLeft--;updateDisplay();if(timeLeft<=3&&timeLeft>0){beep();speak(timeLeft.toString())}if(timeLeft<=0){beep();if(!isResting){if(currentExercise===exercises.length-1){clearInterval(timerInterval);completeEl.style.display='block';speak('Workout complete');return}isResting=true;timeLeft=REST_DURATION;speak('Rest time')}else{isResting=false;currentExercise++;timeLeft=EXERCISE_DURATION;speak(exercises[currentExercise])}updateDisplay()}},1000)}
function pauseTimer(){isRunning=false;clearInterval(timerInterval)}function resetTimer(){clearInterval(timerInterval);isRunning=false;currentExercise=0;timeLeft=EXERCISE_DURATION;isResting=false;completeEl.style.display='none';progressBar.style.width='0%';updateDisplay()}
document.getElementById('startBtn').addEventListener('click',startTimer);document.getElementById('pauseBtn').addEventListener('click',pauseTimer);document.getElementById('resetBtn').addEventListener('click',resetTimer);updateDisplay();
</script></body></html>
