<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exercise Timer</title><style>
*{box-sizing:border-box}body{margin:0;padding:clamp(12px,4vw,24px);font-family:Arial,sans-serif;background:linear-gradient(to bottom right,#e2e8f0,#cbd5e1);display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100svh}.container{background:#fff;width:min(100%,460px);max-width:100%;border-radius:clamp(18px,6vw,30px);padding:clamp(16px,5vw,30px);box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center}h1{margin:0 0 8px;color:#1e293b;font-size:clamp(1.5rem,6vw,2rem)}.subtitle{color:#64748b;margin-bottom:clamp(16px,4vw,25px);font-size:clamp(.9rem,3.5vw,1rem)}.exercise{font-size:clamp(1.25rem,6vw,1.75rem);font-weight:bold;color:#1e293b;margin:clamp(12px,4vw,20px) 0;min-height:3.5rem;display:flex;align-items:center;justify-content:center}.mode{display:inline-block;padding:10px 20px;border-radius:20px;font-weight:bold;margin-bottom:10px;color:#fff}.exercise-mode{background:#22c55e}.rest-mode{background:#3b82f6}.timer{font-size:clamp(4rem,20vw,6.25rem);line-height:1.05;font-weight:bold;color:#1e293b;margin:clamp(12px,4vw,25px) 0}.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,15px);margin-top:16px}button{width:100%;min-width:0;border:0;border-radius:16px;padding:clamp(10px,3.8vw,18px) clamp(3px,1vw,10px);font-size:clamp(.78rem,4vw,1.375rem);font-weight:bold;cursor:pointer;color:#fff;white-space:nowrap}.start{background:#22c55e}.pause{background:#f59e0b}.reset{background:#64748b}.progress{width:100%;height:16px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:clamp(18px,5vw,30px)}.progress-bar{height:100%;width:0%;background:#22c55e;transition:width .5s}.complete{font-size:clamp(1.5rem,8vw,2.25rem);color:#22c55e;font-weight:bold;margin-top:24px}@media(max-width:360px){.container{padding:16px}.buttons{gap:5px}button{font-size:.75rem;padding:10px 2px}}
</style></head><body><div class="container"><h1>Exercise Timer</h1><div class="subtitle">10 exercises • 30 sec work • 30 sec rest</div><div id="mode" class="mode exercise-mode">EXERCISE</div><div id="exercise" class="exercise"></div><div id="timer" class="timer">30</div><div id="status"></div><div class="buttons"><button id="startBtn" class="start">▶ START</button><button id="pauseBtn" class="pause">⏸ PAUSE</button><button id="resetBtn" class="reset">🔄 RESET</button></div><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div id="complete" class="complete" style="display:none;">🎉 Workout Complete!</div></div><script>
const exercises=["Warm up Stretches","Balance on left leg","Balance on right leg","Sit to stand","Arm circles forward","Arm circles backward","Row right hand","Row left hand","Leg lifts upper thigh","Cool down stretches"];const EXERCISE_DURATION=30,REST_DURATION=30;let currentExercise=0,timeLeft=EXERCISE_DURATION,isRunning=false,isResting=false,timerInterval,availableVoices=[];const timerEl=document.getElementById('timer'),exerciseEl=document.getElementById('exercise'),modeEl=document.getElementById('mode'),progressBar=document.getElementById('progressBar'),completeEl=document.getElementById('complete');
function loadVoices(){if('speechSynthesis'in window)availableVoices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.addEventListener('voiceschanged',loadVoices)}
function updateDisplay(){timerEl.textContent=timeLeft;if(isResting){modeEl.textContent='REST';modeEl.className='mode rest-mode';exerciseEl.textContent='Rest before '+exercises[currentExercise+1]}else{modeEl.textContent='EXERCISE';modeEl.className='mode exercise-mode';exerciseEl.textContent=exercises[currentExercise]}progressBar.style.width=(currentExercise/exercises.length*100)+'%'}
function speak(text){if(!('speechSynthesis'in window))return;const engine=window.speechSynthesis;engine.cancel();engine.resume();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=navigator.language||'en-US';utterance.rate=0.95;utterance.pitch=1;utterance.volume=1;const lang=utterance.lang.toLowerCase().slice(0,2);const voice=availableVoices.find(v=>v.lang.toLowerCase().startsWith(lang))||availableVoices.find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)utterance.voice=voice;engine.speak(utterance)}
function beep(){const ctx=new(window.AudioContext||window.webkitAudioContext)(),oscillator=ctx.createOscillator();if(ctx.state==='suspended')ctx.resume();oscillator.type='sine';oscillator.frequency.setValueAtTime(800,ctx.currentTime);oscillator.connect(ctx.destination);oscillator.start();oscillator.stop(ctx.currentTime+.15)}
function startTimer(){if(isRunning)return;isRunning=true;speak(isResting?'Rest time':exercises[currentExercise]);timerInterval=setInterval(()=>{timeLeft--;updateDisplay();if(timeLeft<=3&&timeLeft>0){beep();speak(timeLeft.toString())}if(timeLeft<=0){beep();if(!isResting){if(currentExercise===exercises.length-1){clearInterval(timerInterval);isRunning=false;completeEl.style.display='block';speak('Workout complete');return}isResting=true;timeLeft=REST_DURATION;speak('Rest time')}else{isResting=false;currentExercise++;timeLeft=EXERCISE_DURATION;speak(exercises[currentExercise])}updateDisplay()}},1000)}
function pauseTimer(){isRunning=false;clearInterval(timerInterval)}function resetTimer(){clearInterval(timerInterval);isRunning=false;currentExercise=0;timeLeft=EXERCISE_DURATION;isResting=false;completeEl.style.display='none';progressBar.style.width='0%';if('speechSynthesis'in window)speechSynthesis.cancel();updateDisplay()}document.getElementById('startBtn').addEventListener('click',startTimer);document.getElementById('pauseBtn').addEventListener('click',pauseTimer);document.getElementById('resetBtn').addEventListener('click',resetTimer);updateDisplay();</script></body></html>
